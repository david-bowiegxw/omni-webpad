name: Build and test
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: Core and browser tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

  pico:
    name: Firmware ${{ matrix.board }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        board: [pico_w, pico2_w]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib
      - run: |
          git clone --depth 1 --branch 2.2.0 https://github.com/raspberrypi/pico-sdk.git pico-sdk
          git -C pico-sdk submodule update --init --depth 1 lib/tinyusb lib/lwip lib/cyw43-driver lib/mbedtls lib/btstack
      - run: cmake -S firmware/platform/pico -B build/${{ matrix.board }} -G Ninja -DPICO_SDK_PATH="$PWD/pico-sdk" -DPICO_BOARD=${{ matrix.board }} -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/${{ matrix.board }}
      - uses: actions/upload-artifact@v4
        with:
          name: omniwebpad-${{ matrix.board }}
          path: build/${{ matrix.board }}/omniwebpad-${{ matrix.board }}.uf2
          if-no-files-found: error
          retention-days: 3   # releases keep the firmware; CI copies are only for testing

  esp32:
    name: Firmware ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [esp32s2, esp32s3, esp32c3, esp32c6, esp32]
    steps:
      - uses: actions/checkout@v4
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.1
          target: ${{ matrix.target }}
          path: firmware/platform/esp32
          # One image for offset 0x0 so flashing needs a single file.
          command: idf.py build && cd build && esptool.py --chip ${{ matrix.target }} merge_bin -o omniwebpad-${{ matrix.target }}.bin @flash_args
      - uses: actions/upload-artifact@v4
        with:
          name: omniwebpad-${{ matrix.target }}
          path: firmware/platform/esp32/build/omniwebpad-${{ matrix.target }}.bin
          if-no-files-found: error
          retention-days: 3   # releases keep the firmware; CI copies are only for testing

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, pico, esp32]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cp LICENSE THIRD_PARTY_NOTICES.md dist/ && tar -czf dist/licenses.tar.gz licenses
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
