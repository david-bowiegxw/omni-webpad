# Deletes CI artifacts to keep the repository's Actions storage small.
# Firmware for users lives in Releases, which this does not touch.
name: Clean up artifacts
on:
  schedule:
    - cron: '17 3 * * 1'   # weekly
  workflow_dispatch:
    inputs:
      days:
        description: Keep artifacts newer than this many days (0 deletes all)
        default: '2'
permissions:
  actions: write
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/github-script@v7
        env:
          KEEP_DAYS: ${{ inputs.days || '2' }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const cutoff = Date.now() - Number(process.env.KEEP_DAYS) * 86400e3;
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {owner, repo, per_page: 100});
            let count = 0, bytes = 0;
            for (const a of artifacts) {
              if (a.expired || Date.parse(a.created_at) > cutoff) continue;
              await github.rest.actions.deleteArtifact({owner, repo, artifact_id: a.id});
              count++; bytes += a.size_in_bytes;
            }
            core.info(`Deleted ${count} of ${artifacts.length} artifacts, ${(bytes / 1048576).toFixed(1)} MB`);
